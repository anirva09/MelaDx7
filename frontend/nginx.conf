# Serves the SPA and proxies the API on the same origin (no CORS needed in production).
# Processed by the nginx image's envsubst step (only BACKEND_* variables are substituted):
#   BACKEND_ADDR   host:port of the API (docker compose: backend:8000)
upstream meladx7_api {
  server ${BACKEND_ADDR};
  keepalive 16;
}

# Behind a TLS-terminating load balancer (Render, cloud LBs) the scheme seen here is http;
# trust the forwarded one when present so the API knows the original request was https.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Uploads are validated again by the API; this stops oversized bodies at the edge.
  client_max_body_size 11m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://meladx7_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
